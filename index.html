<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1016">
<meta name="description" content="INFRASYNC AI — construction site coordination demo for hackathon evaluation.">
<title>INFRASYNC AI — Site Command</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2367e0b1'/%3E%3Cpath d='M20 18h24M32 18v28M20 46h24' stroke='%23062018' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#080d13;--panel:rgba(18,28,38,.78);--panel-solid:#101a24;--panel2:#162330;--line:rgba(120,160,185,.16);--line2:rgba(120,160,185,.28);
  --text:#e9f1f5;--muted:#8ea3b1;--mint:#67e0b1;--mint2:#2cbf8a;--amber:#f5bc63;--red:#ff6f7b;--blue:#80adff;--purple:#d2a5ff;--cyan:#5fd3e8;
  --radius:16px;--shadow:0 18px 50px rgba(0,0,0,.42);
  --font:Inter,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,system-ui,sans-serif;
}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.bg-orbs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg-orbs i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.38;animation:float 22s ease-in-out infinite}
.bg-orbs i:nth-child(1){width:520px;height:520px;background:#0f6b55;top:-160px;right:-80px}
.bg-orbs i:nth-child(2){width:460px;height:460px;background:#1b3f86;bottom:-180px;left:-120px;animation-delay:-8s}
.bg-orbs i:nth-child(3){width:300px;height:300px;background:#5a2f86;top:40%;left:45%;opacity:.18;animation-delay:-14s}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,30px)}}
#app{position:relative;z-index:1;min-height:100vh}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#243543;border-radius:9px}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login-card{width:min(980px,100%);display:grid;grid-template-columns:1.05fr 1fr;background:var(--panel);border:1px solid var(--line);border-radius:26px;overflow:hidden;box-shadow:var(--shadow);backdrop-filter:blur(18px)}
.login-hero{padding:44px;background:linear-gradient(155deg,rgba(103,224,177,.16),rgba(128,173,255,.08) 55%,transparent);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:20px}
.logo{display:flex;align-items:center;gap:12px}
.logo-mark{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--mint),#3fb6d6);display:grid;place-items:center;color:#062018;font-weight:800;font-size:20px;box-shadow:0 0 40px rgba(103,224,177,.35)}
.logo b{display:block;letter-spacing:1.5px;font-size:16px}.logo small{display:block;color:var(--muted);font-size:10px;letter-spacing:2.4px}
.login-hero h1{font-size:34px;line-height:1.1;letter-spacing:-.8px;margin-top:10px}
.login-hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--mint),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.login-hero p{color:var(--muted);max-width:420px}
.feat{display:grid;gap:10px;margin-top:auto}
.feat div{display:flex;gap:11px;align-items:center;color:#b7c8d2;font-size:13px}
.feat span{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:rgba(103,224,177,.12);color:var(--mint)}
.login-form{padding:36px 34px}
.login-form h2{font-size:20px;margin-bottom:4px}.login-form>p{color:var(--muted);margin-bottom:18px}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;max-height:330px;overflow:auto;padding-right:4px}
.role{border:1px solid var(--line);background:rgba(255,255,255,.025);border-radius:13px;padding:11px;display:flex;gap:10px;align-items:center;cursor:pointer;text-align:left;transition:.15s}
.role:hover{border-color:var(--line2);transform:translateY(-1px)}
.role.sel{border-color:var(--mint);background:rgba(103,224,177,.09);box-shadow:0 0 0 3px rgba(103,224,177,.08)}
.role.manager{grid-column:1/-1}
.role b{display:block;font-size:13px}.role small{color:var(--muted);font-size:11px}
.avatar{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-weight:700;font-size:12px;color:#07121a;flex-shrink:0}
.pin-row{display:flex;gap:10px;margin-top:16px}
.field{display:grid;gap:6px;margin-bottom:12px}
.field label{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:600}
.inp,.sel-inp,textarea.inp{width:100%;background:rgba(5,10,15,.55);border:1px solid var(--line);border-radius:11px;padding:11px 13px;outline:none;transition:.15s}
.inp:focus,.sel-inp:focus{border-color:var(--mint);box-shadow:0 0 0 3px rgba(103,224,177,.12)}
.sel-inp option{background:#101a24}
textarea.inp{resize:vertical;min-height:84px}
.hint{font-size:12px;color:var(--muted)}
.err{color:var(--red);font-size:12.5px;min-height:18px;margin-top:8px}

/* ---------- buttons ---------- */
.btn{border:1px solid var(--line2);background:rgba(255,255,255,.04);padding:10px 16px;border-radius:11px;cursor:pointer;font-weight:600;transition:.15s;display:inline-flex;gap:8px;align-items:center;justify-content:center;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.09)}
.btn.primary{background:linear-gradient(135deg,var(--mint),#3cc7c0);color:#052018;border:0;box-shadow:0 8px 24px rgba(103,224,177,.22)}
.btn.primary:hover{filter:brightness(1.07);transform:translateY(-1px)}
.btn.danger{background:rgba(255,111,123,.12);border-color:rgba(255,111,123,.4);color:#ffb0b6}
.btn.warn{background:rgba(245,188,99,.13);border-color:rgba(245,188,99,.45);color:#ffd899}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:9px}
.btn.big{padding:14px 20px;font-size:15px;border-radius:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.icon-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.03);cursor:pointer;display:grid;place-items:center}
.icon-btn:hover{background:rgba(255,255,255,.08)}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh}
.sidebar{width:256px;flex-shrink:0;padding:22px 14px;border-right:1px solid var(--line);background:rgba(7,12,18,.72);backdrop-filter:blur(16px);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.sidebar .logo{padding:2px 8px 22px}
.nav-item{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;color:#9db0bc;padding:12px;border-radius:11px;cursor:pointer;text-align:left;font-weight:500;transition:.15s;position:relative}
.nav-item svg{width:19px;height:19px;flex-shrink:0}
.nav-item:hover{background:rgba(255,255,255,.04);color:#fff}
.nav-item.active{background:linear-gradient(90deg,rgba(103,224,177,.16),rgba(103,224,177,.03));color:var(--mint)}
.nav-item.active::before{content:"";position:absolute;left:-14px;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--mint)}
.badge{margin-left:auto;background:var(--red);color:#fff;border-radius:99px;font-size:11px;font-weight:700;padding:1px 8px;min-width:22px;text-align:center}
.badge.zero{display:none}
.side-bottom{margin-top:auto;display:grid;gap:10px}
.profile{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.025)}
.profile b{display:block;font-size:13px}.profile small{font-size:10px;letter-spacing:1.4px;color:var(--muted)}
.main{flex:1;min-width:0;padding:26px 30px 40px;max-width:1500px}
.topbar{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:22px;flex-wrap:wrap}
.crumb{font-size:11px;letter-spacing:1.7px;color:var(--muted)}
.topbar h1{font-size:28px;letter-spacing:-.6px;margin:4px 0 2px}
.topbar p{color:var(--muted)}
.top-actions{display:flex;gap:10px;align-items:center}
.live-pill{display:flex;align-items:center;gap:8px;padding:8px 13px;border:1px solid var(--line);border-radius:99px;font-size:12px;color:#b8c9d3;background:rgba(255,255,255,.025)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 0 rgba(103,224,177,.6);animation:pulse 1.8s infinite}
.dot.off{background:var(--red);animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(103,224,177,0)}100%{box-shadow:0 0 0 0 rgba(103,224,177,0)}}

/* ---------- cards ---------- */
.grid{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:16px}
.g-3{grid-template-columns:1fr 1.15fr 1fr;margin-bottom:16px;align-items:start}
.g-2{grid-template-columns:1.4fr 1fr;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;backdrop-filter:blur(14px);box-shadow:0 8px 30px rgba(0,0,0,.18)}
.card h3{font-size:14px;letter-spacing:.2px;display:flex;align-items:center;gap:8px;margin-bottom:14px}
.card h3 small{margin-left:auto;color:var(--muted);font-weight:400;font-size:12px}
.kpi{position:relative;overflow:hidden;animation:rise .5s both}
.kpi::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:var(--c,var(--mint));opacity:.12;filter:blur(8px)}
.kpi small{color:var(--muted);font-size:11px;letter-spacing:1.1px;text-transform:uppercase;font-weight:600}
.kpi b{display:block;font-size:34px;letter-spacing:-1px;margin:6px 0 2px;color:var(--c,var(--text))}
.kpi span{color:var(--muted);font-size:12px}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.chip.assigned{background:rgba(128,173,255,.12);color:var(--blue);border-color:rgba(128,173,255,.3)}
.chip.in_progress{background:rgba(95,211,232,.12);color:var(--cyan);border-color:rgba(95,211,232,.3)}
.chip.completed{background:rgba(103,224,177,.12);color:var(--mint);border-color:rgba(103,224,177,.3)}
.chip.delayed,.chip.high{background:rgba(255,111,123,.13);color:#ff9aa3;border-color:rgba(255,111,123,.35)}
.chip.medium,.chip.overdue{background:rgba(245,188,99,.13);color:var(--amber);border-color:rgba(245,188,99,.35)}
.chip.low{background:rgba(128,173,255,.12);color:var(--blue);border-color:rgba(128,173,255,.3)}
.chip.neutral{background:rgba(255,255,255,.05);color:#b8c9d3;border-color:var(--line)}
.chip.ok{background:rgba(103,224,177,.12);color:var(--mint);border-color:rgba(103,224,177,.3)}
.legend{display:grid;gap:8px;margin-top:14px}
.legend div{display:flex;align-items:center;gap:9px;font-size:12.5px;color:#b8c9d3}
.legend i{width:10px;height:10px;border-radius:3px}.legend b{margin-left:auto;color:var(--text)}
.donut-wrap{display:flex;justify-content:center;position:relative}
.donut-wrap .center{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.donut-wrap .center b{font-size:30px;letter-spacing:-1px}.donut-wrap .center small{color:var(--muted);font-size:11px}
.hbar{display:grid;gap:5px;margin-bottom:12px}
.hbar .row{display:flex;justify-content:space-between;font-size:12.5px;color:#c4d3dc}
.track{height:8px;border-radius:8px;background:rgba(255,255,255,.07);overflow:hidden}
.track i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--c,var(--mint)),color-mix(in srgb,var(--c,var(--mint)) 60%,#fff));transition:width .8s cubic-bezier(.2,.8,.2,1)}
.empty{color:var(--muted);text-align:center;padding:28px 10px;font-size:13px}
.empty svg{width:34px;height:34px;opacity:.5;margin-bottom:8px}

/* lists */
.list{display:grid;gap:9px}
.item{display:flex;gap:12px;align-items:center;padding:11px 12px;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.02);cursor:pointer;transition:.15s;text-align:left;width:100%}
.item:hover{border-color:var(--line2);background:rgba(255,255,255,.045);transform:translateX(2px)}
.item .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex-shrink:0}
.item .ic.red{background:rgba(255,111,123,.14);color:var(--red)}.item .ic.amber{background:rgba(245,188,99,.14);color:var(--amber)}
.item b{display:block;font-size:13px}.item small{color:var(--muted);font-size:12px}
.item .grow{flex:1;min-width:0}.item .grow *{overflow:hidden;text-overflow:ellipsis}
.feed{display:grid;gap:0;max-height:430px;overflow:auto}
.feed .ev{display:flex;gap:11px;padding:10px 2px;border-bottom:1px solid var(--line);animation:rise .4s both}
.feed .ev:last-child{border:0}
.feed .bubble{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex-shrink:0;font-size:13px}
.feed p{font-size:13px;color:#d3e0e8}.feed small{color:var(--muted);font-size:11.5px}
.ring{position:relative;width:62px;height:62px;flex-shrink:0}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:13px}
.proj-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.pcard{display:flex;gap:14px;align-items:center;cursor:pointer;transition:.15s}
.pcard:hover{border-color:var(--line2);transform:translateY(-2px)}
.pcard b{font-size:14.5px;display:block}.pcard small{color:var(--muted)}
.mini{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* tables */
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:13px}
table{width:100%;border-collapse:collapse;min-width:760px}
th{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);text-align:left;padding:11px 12px;background:rgba(255,255,255,.03);font-weight:600}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle;font-size:13px}
tr:hover td{background:rgba(255,255,255,.02)}
td .sel-inp,td .inp{padding:7px 9px;font-size:12.5px}
.prog-mini{display:flex;align-items:center;gap:8px;min-width:100px}.prog-mini .track{flex:1;height:6px}.prog-mini small{color:var(--muted);width:32px}
.person{display:flex;align-items:center;gap:8px}.person .avatar{width:26px;height:26px;border-radius:8px;font-size:10px}

.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:transparent;color:#a9bbc6;padding:7px 14px;border-radius:99px;cursor:pointer;font-weight:600;font-size:12.5px}
.tab.on{background:rgba(103,224,177,.14);color:var(--mint);border-color:rgba(103,224,177,.4)}

/* delay cards */
.dcard{display:grid;grid-template-columns:150px 1fr auto;gap:16px;align-items:center;cursor:pointer;transition:.15s;margin-bottom:12px;animation:rise .4s both}
.dcard:hover{border-color:var(--line2);transform:translateY(-2px)}
.dcard.new{border-color:rgba(255,111,123,.4);box-shadow:0 0 0 3px rgba(255,111,123,.06)}
.thumbs{display:grid;grid-template-columns:1fr 1fr;gap:4px;height:92px;border-radius:12px;overflow:hidden;background:#0b141c}
.thumbs.one{grid-template-columns:1fr}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs .none{display:grid;place-items:center;color:var(--muted);font-size:12px;grid-column:1/-1}
.dcard h4{margin:0 0 4px;font-size:15px}.dcard p{color:#b4c5cf;font-size:13px;margin:6px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:12px}
.ai-badge{display:inline-flex;gap:6px;align-items:center;padding:4px 10px;border-radius:9px;background:linear-gradient(90deg,rgba(210,165,255,.16),rgba(128,173,255,.12));border:1px solid rgba(210,165,255,.35);color:#e3cbff;font-weight:600;font-size:12px}
.conf{font-size:11px;color:var(--muted);text-align:right}
.days-late{text-align:center;padding:10px 16px;border-radius:14px;background:rgba(255,111,123,.1);border:1px solid rgba(255,111,123,.3)}
.days-late b{display:block;font-size:26px;color:#ff9aa3;letter-spacing:-1px;line-height:1}.days-late small{color:#ffb7bd;font-size:11px}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(2,6,10,.72);backdrop-filter:blur(6px);z-index:50;display:grid;place-items:center;padding:18px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{width:min(720px,100%);max-height:94vh;overflow:auto;background:var(--panel-solid);border:1px solid var(--line2);border-radius:22px;box-shadow:var(--shadow);animation:pop .25s cubic-bezier(.2,.9,.3,1.2)}
.modal.wide{width:min(1000px,100%)}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.97)}}
.modal-head{display:flex;justify-content:space-between;gap:14px;padding:20px 22px 14px;position:sticky;top:0;background:var(--panel-solid);z-index:2;border-bottom:1px solid var(--line)}
.modal-head h2{font-size:19px;letter-spacing:-.3px}.modal-head p{color:var(--muted);font-size:13px;margin-top:2px}
.modal-body{padding:18px 22px}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;align-items:center;padding:14px 22px 20px;position:sticky;bottom:0;background:var(--panel-solid);border-top:1px solid var(--line);flex-wrap:wrap}
.modal-foot .sp{margin-right:auto;color:var(--muted);font-size:12.5px}
.ai-panel{border:1px solid rgba(210,165,255,.3);background:linear-gradient(135deg,rgba(210,165,255,.1),rgba(128,173,255,.06));border-radius:16px;padding:16px;margin-bottom:16px}
.ai-panel h4{margin:0 0 8px;font-size:12px;letter-spacing:1.4px;color:#d9bcff;text-transform:uppercase}
.ai-panel .big{font-size:17px;font-weight:700;margin-bottom:6px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 14px;font-size:13px;margin:12px 0}.kv dt{color:var(--muted)}.kv dd{margin:0}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:8px}
.gallery img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;border:1px solid var(--line);cursor:zoom-in;transition:.15s;background:#0b141c}
.gallery img:hover{transform:scale(1.03);border-color:var(--mint)}
.lightbox{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.92);display:grid;place-items:center;padding:20px;animation:fade .15s}
.lightbox[hidden]{display:none}
.lightbox img{max-width:95vw;max-height:88vh;border-radius:12px;box-shadow:var(--shadow)}
.lightbox .nav{position:absolute;top:50%;transform:translateY(-50%);font-size:34px;background:rgba(255,255,255,.1);border:0;color:#fff;width:50px;height:50px;border-radius:50%;cursor:pointer}
.lightbox .prev{left:20px}.lightbox .next{right:20px}.lightbox .close{position:absolute;top:18px;right:20px;font-size:22px;background:rgba(255,255,255,.1);border:0;color:#fff;width:42px;height:42px;border-radius:50%;cursor:pointer}
.lightbox small{position:absolute;bottom:18px;color:#bcd}

/* wizard */
.steps{display:flex;gap:8px;align-items:center;margin-top:12px}
.step{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.step i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;border:1px solid var(--line2);font-size:12px}
.step.on{color:var(--text)}.step.on i{background:var(--mint);color:#052018;border-color:var(--mint)}
.step.done i{background:rgba(103,224,177,.2);color:var(--mint)}
.step-sep{height:1px;width:34px;background:var(--line2)}
.tmpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.tmpl{border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;background:rgba(255,255,255,.02);text-align:left;transition:.15s}
.tmpl:hover{border-color:var(--line2)}
.tmpl.sel{border-color:var(--mint);background:rgba(103,224,177,.09);box-shadow:0 0 0 3px rgba(103,224,177,.08)}
.tmpl b{display:block;margin:6px 0 2px}.tmpl small{color:var(--muted)}
.tmpl .emoji{font-size:24px}

/* ============================== charts ============================== */
function donut(segs, centerBig, centerSmall) {
  const r = 54, c = 2 * Math.PI * r, total = segs.reduce((a, s) => a + s.v, 0);
  let off = 0, arcs = '';
  if (total) segs.filter(s => s.v).forEach(s => { const len = s.v / total * c; arcs += `<circle cx="70" cy="70" r="${r}" fill="none" stroke="${s.c}" stroke-width="16" stroke-dasharray="${Math.max(0, len - 2)} ${c - Math.max(0, len - 2)}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`; off += len; });
  return `<div class="donut-wrap"><svg viewBox="0 0 140 140" width="170" height="170"><circle cx="70" cy="70" r="${r}" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="16"/>${arcs}</svg><div class="center"><b>${centerBig}</b><small>${centerSmall}</small></div></div>`;
}
function ring(pct, color = '#67e0b1') {
  const r = 26, c = 2 * Math.PI * r;
  return `<div class="ring"><svg viewBox="0 0 64 64" width="62" height="62"><circle cx="32" cy="32" r="${r}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="7"/><circle cx="32" cy="32" r="${r}" fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c * pct / 100} ${c}" transform="rotate(-90 32 32)"/></svg><span>${pct}%</span></div>`;
}
const bar = (label, val, max, color, right) => `<div class="hbar"><div class="row"><span>${label}</span><b>${right ?? val}</b></div><div class="track" style="--c:${color}"><i style="width:${max ? Math.max(4, val / max * 100) : 0}%"></i></div></div>`;
const emptyState = (t, s = '') => `<div class="empty">${ICON.inbox}<div>${esc(t)}</div><div style="font-size:12px">${esc(s)}</div></div>`;

/* ============================== realtime ============================== */
let wsRetry = 0, pingTimer = null;
function connectWS() {
  if (STATIC_DEMO) { S.wsOk = false; setLive(); return; }
  if (S.ws) { S.ws.onclose = null; try { S.ws.close(); } catch { } }
  const url = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws?token=' + encodeURIComponent(S.token);
  const ws = new WebSocket(url); S.ws = ws;
  ws.onopen = () => { S.wsOk = true; wsRetry = 0; setLive(); refresh(); clearInterval(pingTimer); pingTimer = setInterval(() => { try { ws.send('ping'); } catch { } }, 25000); };
  ws.onmessage = ev => {
    let m; try { m = JSON.parse(ev.data); } catch { return; }
    if (m.type !== 'update') return;
    refreshSoon();
    if (m.actor && m.actor !== S.me?.id) {
      if (S.me.role === 'manager') {
        if (m.kind === 'delay') { toast(m.message, 'warn', '⚠ New delay report'); beep(); }
        else if (m.kind === 'completed') toast(m.message, '', '✓ Work completed');
        else toast(m.message, '', 'Field update');
      } else toast(m.message, m.kind === 'reopen' ? 'warn' : '', 'Manager update');
    }
  };
  ws.onclose = () => { S.wsOk = false; setLive(); clearInterval(pingTimer); if (S.token) setTimeout(connectWS, Math.min(8000, 800 * ++wsRetry)); };
  ws.onerror = () => { try { ws.close(); } catch { } };
}
function setLive() { $$('.live-pill').forEach(p => { p.innerHTML = STATIC_DEMO ? '<span class="dot off"></span><span class="t">Demo · saved in this browser</span>' : `<span class="dot ${S.wsOk ? '' : 'off'}"></span><span class="t">${S.wsOk ? 'Live · real-time' : 'Reconnecting…'}</span>`; }); }
setInterval(() => { if (!STATIC_DEMO && S.token && !S.wsOk) refresh(); }, 6000);
setInterval(() => { if (!STATIC_DEMO && S.token) refresh(); }, 45000); // safety net

  S.renderPending = false;

}

let W = null;
async function openWizard() {

function recomputeDue() { let cur = W.start; W.tasks.forEach(t => { if (!t.on) return; cur = addDays(cur, t.duration_days); if (!t.edited) t.due = cur; }); }
const wsel = () => W.tasks.filter(t => t.on);

    <div class="field"><label>Title *</label><input class="inp" id="aTitle"></div><div class="field"><label>Description</label><input class="inp" id="aDesc"></div>
    <div class="grid" style="grid-template-columns:1fr 1fr;gap:12px"><div class="field"><label>Field</label><select class="sel-inp" id="aTrade">${tr.map(t => `<option>${esc(t)}</option>`).join('')}</select></div>
    <div class="field"><label>Assign to</label><select class="sel-inp" id="aWorker">${S.data.workers.map(w => `<option value="${w.id}">${esc(w.name)} · ${esc(w.trade)}</option>`).join('')}</select></div>
    <div class="field"><label>Due date</label><input class="inp" type="date" id="aDue" value="${addDays(S.data.today, 3)}"></div><div class="field"><label>Duration (days)</label><input class="inp" type="number" min="1" id="aDur" value="2"></div></div><div class="err" id="aErr"></div></div>
    <div class="modal-foot"><button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" data-act="addTaskGo" data-id="${pid}">Add & assign</button></div>`, { sticky: true });
  const sync = () => { const t = $('#aTrade').value; const w = S.data.workers.find(w => w.trade === t); if (w) $('#aWorker').value = w.id; };
  $('#aTrade').onchange = sync; sync();
}

/* ============================== WORKER ============================== */
const photos = []; // pending uploads {blob,url}
function renderWorker() {
  S.shellFor = 'worker';
  const d = S.data, me = S.me, T = d.tasks;
  const active = T.filter(t => t.status !== 'completed'), done = T.filter(t => t.status === 'completed');
  const list = S.workerTab === 'done' ? done : active;
  const prio = { delayed: 0, in_progress: 1, assigned: 2 };
  list.sort((a, b) => (b.is_overdue - a.is_overdue) || ((prio[a.status] ?? 3) - (prio[b.status] ?? 3)) || String(a.due_date).localeCompare(b.due_date));
  const y = window.scrollY;
  $('#app').innerHTML = `<div class="worker-main" id="page">
    <div class="wtop"><div class="whello"><h1>${greet()}, ${esc(me.name.split(' ')[0])} 👋</h1><p>${esc(me.trade)} crew · your assigned work</p></div><div style="display:flex;gap:8px;align-items:center"><div class="live-pill"></div><button class="icon-btn" data-act="logout" title="Sign out">${ICON.logout}</button></div></div>
    <div class="wstats"><div class="card"><b style="color:var(--blue)">${T.filter(t => t.status === 'assigned').length}</b><small>To start</small></div><div class="card"><b style="color:var(--cyan)">${T.filter(t => t.status === 'in_progress' || t.status === 'delayed').length}</b><small>Working</small></div><div class="card"><b style="color:var(--mint)">${done.length}</b><small>Done</small></div></div>
    <div class="panel-head"><div class="tabs"><button class="tab ${S.workerTab === 'active' ? 'on' : ''}" data-act="wTab" data-id="active">Active · ${active.length}</button><button class="tab ${S.workerTab === 'done' ? 'on' : ''}" data-act="wTab" data-id="done">Completed · ${done.length}</button></div></div>
    ${list.length ? list.map(taskCard).join('') : `<div class="card">${emptyState(S.workerTab === 'done' ? 'Nothing completed yet' : 'No work assigned', S.workerTab === 'done' ? '' : 'New tasks from your manager appear here instantly.')}</div>`}</div>`;
  setLive(); window.scrollTo(0, y);
}
function taskCard(t, i) {
  const p = project(t.project_id), rep = S.data.reports.find(r => r.task_id === t.id && r.kind === 'delay');
  const cls = t.is_overdue && t.status !== 'completed' ? 'overdue' : t.status;
  const pr = t.status === 'completed' ? 100 : t.progress || 0;
  return `<div class="card tcard ${cls}" style="animation-delay:${i * 40}ms"><div class="top"><div><h4>${esc(t.title)}</h4><div class="hint">${esc(p.name)} · ${esc(p.location)}</div></div>${statusChip(t)}</div>
    <div class="desc">${esc(t.description)}</div>
    <div class="meta"><span>📅 Due ${fmtDate(t.due_date)}</span>${t.is_overdue ? chip('overdue', 'Past due') : ''}<span>· ${pr}% done</span></div>
    <div class="track" style="margin-top:10px;--c:${t.status === 'delayed' ? '#ff6f7b' : '#67e0b1'}"><i style="width:${pr}%"></i></div>
    ${t.status === 'delayed' && rep ? `<div class="note-box"><b>You reported a delay:</b> ${esc(rep.ai_cause)} — “${esc(rep.reason)}”</div>` : ''}
    ${t.status === 'completed' ? `<div class="hint" style="margin-top:10px">✓ Completed ${ago(t.completed_at)}</div>` : `<div class="actions">
      ${t.status === 'assigned' ? `<button class="btn" data-act="wStart" data-id="${t.id}">▶ Start work</button>` : `<button class="btn" data-act="wProgress" data-id="${t.id}">↗ Update progress</button>`}
      <button class="btn" data-act="wPhoto" data-id="${t.id}">📷 Send photo</button>
      <button class="btn primary" data-act="wFinish" data-id="${t.id}">✓ Finish task</button></div>`}</div>`;
}
function progressModal(id) {
  const t = task(id); photos.length = 0;
  openModal(`<div class="modal-head"><div><h2>Update progress</h2><p>${esc(t.title)}</p></div><button class="icon-btn" data-act="closeModal">✕</button></div><div class="modal-body">
    <div class="range-val" id="pv">${t.progress || 0}%</div><input class="range" id="pr" type="range" min="0" max="99" step="5" value="${t.progress || 0}">
    <div class="field" style="margin-top:18px"><label>What was done? (optional)</label><textarea class="inp" id="pn" placeholder="e.g. Finished blocks A and B"></textarea></div>${photoPicker(false)}<div class="err" id="rErr"></div></div>
    <div class="modal-foot"><button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" data-act="wProgressGo" data-id="${id}">Send update to manager</button></div>`);
  $('#pr').oninput = e => $('#pv').textContent = e.target.value + '%';
}
function finishModal(id) {
  const t = task(id);
  openModal(`<div class="modal-head"><div><h2>Finish task</h2><p>${esc(t.title)}</p></div><button class="icon-btn" data-act="closeModal">✕</button></div><div class="modal-body"><p class="hint" style="margin-bottom:14px;text-align:center">How did this task go?</p><div class="choice">
    <button class="ok" data-act="wDone" data-id="${id}"><span class="em">✅</span><b>Completed</b><small>Work finished</small></button>
    <button class="late" data-act="wDelay" data-id="${id}"><span class="em">⚠️</span><b>Delayed</b><small>Report reason + photo proof</small></button></div></div>`);
}
const photoPicker = (req) => `<div class="field"><label>Photos ${req ? '* (required as proof)' : '(optional)'}</label><div class="photo-actions"><button type="button" class="btn sm" data-act="camera">📷 Take photo</button><button type="button" class="btn sm" data-act="gallery">🖼️ Upload from gallery</button></div>
  <input type="file" id="fCam" accept="image/*" capture="environment" hidden><input type="file" id="fUp" accept="image/*" multiple hidden><div class="previews" id="previews"></div><div class="drop-hint" id="dropHint">No photos added yet</div></div>`;
function drawPreviews() {
  const el = $('#previews'); if (!el) return;
  el.innerHTML = photos.map((p, i) => `<div class="pv"><img src="${p.url}" alt=""><button type="button" data-act="rmPhoto" data-id="${i}">✕</button></div>`).join('');
  const h = $('#dropHint'); if (h) h.style.display = photos.length ? 'none' : '';
}
async function compress(file) {
  if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return file;
  try {
    const bmp = await createImageBitmap(file), max = 1600, k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', .82));
    return blob && blob.size < file.size ? blob : file;
  } catch { return file; }
}
async function addPhotos(files) {
  for (const f of files) { const b = await compress(f); photos.push({ blob: b, url: URL.createObjectURL(b), name: 'photo-' + Date.now() + '-' + photos.length + (b.type === 'image/jpeg' ? '.jpg' : '.' + (f.name.split('.').pop() || 'jpg')) }); }
  drawPreviews();
}
document.addEventListener('change', e => {
  if (e.target.id === 'fCam' || e.target.id === 'fUp') { addPhotos([...e.target.files]); e.target.value = ''; }
});
function doneModal(id) {
  const t = task(id); photos.length = 0;
  openModal(`<div class="modal-head"><div><h2>Mark as completed ✅</h2><p>${esc(t.title)}</p></div><button class="icon-btn" data-act="closeModal">✕</button></div><div class="modal-body">
    <div class="field"><label>Notes (optional)</label><textarea class="inp" id="rNotes" placeholder="Anything the manager should know"></textarea></div>${photoPicker(false)}<div class="err" id="rErr"></div></div>
    <div class="modal-foot"><button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" data-act="submitDone" data-id="${id}">Submit as completed</button></div>`, { sticky: true });
}
function photoModal(id) {
  const t = task(id); photos.length = 0;
  openModal(`<div class="modal-head"><div><h2>Send photos 📷</h2><p>${esc(t.title)}</p></div><button class="icon-btn" data-act="closeModal">✕</button></div><div class="modal-body">
    <p class="hint" style="margin-bottom:12px">Show the manager how the work looks right now.</p>${photoPicker(true).replace(' * (required as proof)', ' *')}
    <div class="field"><label>Note (optional)</label><textarea class="inp" id="rNotes" placeholder="e.g. Slab shuttering finished on the 2nd floor"></textarea></div><div class="err" id="rErr"></div></div>
    <div class="modal-foot"><button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" data-act="submitPhoto" data-id="${id}">Send to manager</button></div>`, { sticky: true });
}
let delayCause = '';
function delayModal(id) {
  const t = task(id); photos.length = 0; delayCause = '';
  const causes = Object.keys(CAUSE_ICON);
  const late = Math.max(1, Math.round((new Date(S.data.today) - new Date(t.due_date)) / 864e5) || 1);
  openModal(`<div class="modal-head"><div><h2>Report delay ⚠️</h2><p>${esc(t.title)}</p></div><button class="icon-btn" data-act="closeModal">✕</button></div><div class="modal-body">
    <div class="field"><label>1 · What caused the delay? *</label><div class="cause-grid">${causes.map(c => `<button type="button" class="cause" data-act="pickCause" data-id="${esc(c)}">${CAUSE_ICON[c]} ${esc(c)}</button>`).join('')}</div></div>
    <div class="field"><label>2 · Explain what happened *</label><textarea class="inp" id="dReason" placeholder="e.g. Cement delivery arrived 2 days late, crew waiting on site"></textarea></div>
    <div class="field"><label>3 · How many days late? *</label><input class="inp" type="number" min="0" max="365" id="dDays" value="${late}" style="max-width:140px"></div>
    <div class="field"><label>Extra notes (optional)</label><input class="inp" id="dNotes"></div>
    ${photoPicker(true)}<div class="err" id="rErr"></div></div>
    <div class="modal-foot"><button class="btn" data-act="closeModal">Cancel</button><button class="btn danger" data-act="submitDelay" data-id="${id}">Submit delay report</button></div>`, { sticky: true });
}
async function submit(id, kind) {
  const err = $('#rErr'); err.textContent = '';
  const fd = new FormData(); fd.append('kind', kind);
  if (kind === 'delay') {
    const reason = $('#dReason').value.trim();
    if (!delayCause) return err.textContent = 'Please choose the cause of the delay.';
    if (reason.length < 5) return err.textContent = 'Please explain what happened.';
    if (!photos.length) return err.textContent = 'Please add at least one photo as proof.';
    fd.append('cause', delayCause); fd.append('reason', reason); fd.append('delay_days', $('#dDays').value || '0'); fd.append('notes', $('#dNotes').value);
  } else { if (kind === 'photo' && !photos.length) return err.textContent = 'Please add at least one photo.'; fd.append('notes', $('#rNotes').value); }
  photos.forEach(p => fd.append('photos', p.blob, p.name));
  const btn = $('.modal-foot .btn:last-child'); btn.disabled = true; btn.textContent = 'Uploading…';
  try {
    await api(`/api/tasks/${id}/report`, { method: 'POST', body: fd });
    closeModal(); toast(kind === 'delay' ? 'Delay report sent to your manager' : kind === 'photo' ? 'Photos sent to your manager' : 'Marked as completed — great work!', '', '✓ Submitted'); await refresh();
  } catch (e) { err.textContent = e.message; btn.disabled = false; btn.textContent = kind === 'delay' ? 'Submit delay report' : kind === 'photo' ? 'Send to manager' : 'Submit as completed'; }
}

/* ============================== events ============================== */
const ACT = {
  goLogin() { showLogin(); },
  goLanding() { showLanding(); },
  scrollTo(d) { document.getElementById(d.id)?.scrollIntoView({ behavior: 'smooth', block: 'start' }); },
  gotoTask(d) {
    const t = task(d.id); if (!t) return;
    S.page = 'projects'; S.open[t.project_id] = true; render();
    setTimeout(() => { const row = document.getElementById('task-' + t.id); if (row) { row.scrollIntoView({ behavior: 'smooth', block: 'center' }); row.classList.add('flash'); setTimeout(() => row.classList.remove('flash'), 3500); } }, 80);
    openTask(t.id);
  },
  wPhoto(d) { photoModal(d.id); },
  pickRole(d, el) { loginSel = d.id; $$('.role').forEach(r => r.classList.toggle('sel', r === el)); $('#pin')?.focus(); },
  logout() { logout(); },
  nav(d) { S.page = d.id; render(); window.scrollTo(0, 0); },
  newProject() { openWizard(); },
  closeModal() { closeModal(); },
  gotoProject(d) { S.page = 'projects'; S.open[d.id] = true; render(); setTimeout(() => document.getElementById('proj-' + d.id)?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 60); },
  toggleProject(d) { const i = S.data.projects.findIndex(p => p.id === d.id); S.open[d.id] = !(S.open[d.id] ?? i === 0); render(); },
  delProject(d) { if (confirm('Delete this project and all its tasks, reports and photos records?')) act(() => api('/api/projects/' + d.id, { method: 'DELETE' }), 'Project deleted'); },
  addTask(d) { addTaskModal(d.id); },
  async addTaskGo(d) {
    const title = $('#aTitle').value.trim(); if (!title) return $('#aErr').textContent = 'Title is required';
    try { await api(`/api/projects/${d.id}/tasks`, { method: 'POST', json: { title, description: $('#aDesc').value, trade: $('#aTrade').value, assignee: $('#aWorker').value, due_date: $('#aDue').value, duration_days: +$('#aDur').value || 1 } }); closeModal(); toast('Work assigned'); refresh(); } catch (e) { $('#aErr').textContent = e.message; }
  },
  openTask(d, el, ev) { ev.preventDefault(); openTask(d.id); },
  openReport(d) { openReport(d.id); },
  delayTab(d) { S.delayTab = d.id; render(); },
  reopen(d) { act(() => api(`/api/tasks/${d.id}/reopen`, { method: 'POST' }), 'Task reopened').then(() => { if (d.close) closeModal(); }); },
  async review(d) { const note = $('#mgrNote')?.value || ''; try { await api(`/api/reports/${d.id}/review`, { method: 'POST', json: { note } }); closeModal(); toast('Report marked reviewed'); refresh(); } catch (e) { toast(e.message, 'err'); } },
  lb(d) { const r = S.data.reports.find(x => x.id === d.id); openLightbox(r.photos, +d.i); },
  lbClose() { closeLightbox(); },
  lbPrev() { lb.i = (lb.i - 1 + lb.list.length) % lb.list.length; drawLightbox(); },
  lbNext() { lb.i = (lb.i + 1) % lb.list.length; drawLightbox(); },
  /* wizard */
  wizClose() { if (confirm('Discard this new project?')) closeModal(); },
  wizTemplate(d) { wizReadStep1(); pickTemplate(d.id); W.err = ''; drawWizard(); },
  wizNext() { wizReadStep1(); if (!W.name) { W.err = 'Please enter a project name.'; return drawWizard(); } if (!W.template) { W.err = 'Please choose a project type.'; return drawWizard(); } recomputeDue(); W.err = ''; W.step = 2; drawWizard(); },
  wizBack() { W.step = 1; drawWizard(); },
  wizAll(d) { W.tasks.forEach(t => t.on = d.id === '1'); recomputeDue(); drawWizard(); },
  wizAuto() { W.tasks.forEach(t => t.assignee = S.templates.trade_owner[t.trade] || 'worker1'); drawWizard(); toast('Assigned each work package to the matching field specialist'); },
  wizCustom() { wizCustom(); },
  wizCreate() { wizCreate(); },
  /* worker */
  wTab(d) { S.workerTab = d.id; render(); },
  wStart(d) { act(() => api(`/api/tasks/${d.id}/start`, { method: 'POST' }), 'Work started — manager notified'); },
  wProgress(d) { progressModal(d.id); },
  async wProgressGo(d) {
    const btn = $('.modal-foot .btn:last-child'); btn.disabled = true; btn.textContent = 'Sending…';
    try {
      const note = $('#pn').value;
      await api(`/api/tasks/${d.id}/progress`, { method: 'POST', json: { progress: +$('#pr').value, note } });
      if (photos.length) { const fd = new FormData(); fd.append('kind', 'photo'); fd.append('notes', note); photos.forEach(p => fd.append('photos', p.blob, p.name)); await api(`/api/tasks/${d.id}/report`, { method: 'POST', body: fd }); }
      const hadPhotos = photos.length; closeModal(); toast(hadPhotos ? 'Progress and photos sent to manager' : 'Progress sent to manager'); refresh();
    } catch (e) { $('#rErr').textContent = e.message; btn.disabled = false; btn.textContent = 'Send update to manager'; }
  },
  wFinish(d) { finishModal(d.id); },
  wDone(d) { doneModal(d.id); },
  wDelay(d) { delayModal(d.id); },
  pickCause(d, el) { delayCause = d.id; $$('.cause').forEach(c => c.classList.toggle('sel', c === el)); },
  camera() { $('#fCam').click(); },
  gallery() { $('#fUp').click(); },
  rmPhoto(d) { URL.revokeObjectURL(photos[+d.id]?.url); photos.splice(+d.id, 1); drawPreviews(); },
  submitDone(d) { submit(d.id, 'completed'); },
  submitPhoto(d) { submit(d.id, 'photo'); },
  submitDelay(d) { submit(d.id, 'delay'); },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.tagName === 'A') e.preventDefault();
  fn(el.dataset, el, e);
});
const CHG = {
  assign(el) { act(() => api(`/api/tasks/${el.dataset.id}/assign`, { method: 'PATCH', json: { assignee: el.value } }), 'Reassigned — worker notified'); },
  due(el) { if (el.value) act(() => api(`/api/tasks/${el.dataset.id}/assign`, { method: 'PATCH', json: { due_date: el.value } }), 'Due date updated'); },
  wizTog(el) { W.tasks[+el.dataset.id].on = el.checked; recomputeDue(); drawWizard(); },
  wizAsg(el) { W.tasks[+el.dataset.id].assignee = el.value; drawWizard(); },
  wizDue(el) { const t = W.tasks[+el.dataset.id]; t.due = el.value; t.edited = true; drawWizard(); },
  wizGroup(el) { if (!el.value) return; W.tasks.forEach(t => { if (t.trade === el.dataset.id && t.on) t.assignee = el.value; }); drawWizard(); },
};
document.addEventListener('change', e => { const el = e.target.closest('[data-change]'); if (el && CHG[el.dataset.change]) CHG[el.dataset.change](el); });

/* ============================== boot ============================== */
(async function boot() {
  const tk = store.get('infrasync_token');
  if (tk) {
    S.token = tk;
    try { await startApp(); return; } catch { S.token = null; store.del('infrasync_token'); }
  }
  showLanding();
})();
})();

</script>
</body>
